name: MCP Actions write proof

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Optional completed workflow run ID to re-run as an Actions-write proof"
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  verify-actions-write:
    name: Verify MCP Actions write contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Actions API read access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=1" \
            >/dev/null

      - name: Re-run selected completed workflow as write proof
        if: ${{ inputs.target_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          set -euo pipefail
          [[ "${TARGET_RUN_ID}" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/rerun"

      - name: Record contract boundary
        shell: bash
        run: |
          cat <<'EOF'
          This workflow proves the repository GITHUB_TOKEN can be granted Actions write
          permission for an explicitly dispatched job. The external GitHub MCP app's
          repository and Actions permissions are controlled by its GitHub App installation.
          EOF
