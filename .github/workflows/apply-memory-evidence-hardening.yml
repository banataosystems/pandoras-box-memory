name: Apply Memory evidence hardening patch

on:
  push:
    branches:
      - hardening/memory-evidence-intake-atomic-approved-20260820
    paths:
      - .github/workflows/apply-memory-evidence-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-memory-evidence-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/memory-evidence-intake-atomic-approved-20260820

      - name: Verify bounded source lane
        shell: bash
        run: |
          set -euo pipefail
          expected_base='4d0075a2e79db504a80feec914ed379fdf87cf0d'
          git merge-base --is-ancestor "$expected_base" HEAD
          unexpected="$({
            git diff --name-only "$expected_base"...HEAD
          } | grep -Ev '^(.github/workflows/apply-memory-evidence-hardening.yml|scripts/apply_memory_evidence_hardening.patch|scripts/check_memory_evidence_atomic_hardening.mjs|supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql)$' || true)"
          test -z "$unexpected" || {
            printf 'Unexpected pre-apply paths:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Apply exact bridge replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/pandora-projectos-bridge/index.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'const RETRIEVABLE_CANON_STATUSES = new Set(["hard_canon", "soft_canon", "draft"]);',
                  'const RETRIEVABLE_CANON_STATUSES = new Set(["hard_canon", "soft_canon"]);',
                  "approved-only canon retrieval",
              ),
              (
                  '    privacy_policy: "metadata_only_v1",',
                  '    privacy_policy: "metadata_only_v2_fail_closed",',
                  "privacy response contract",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one source match, found {count}")
              if source.count(new) != 0:
                  raise SystemExit(f"{label}: replacement already present")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify and commit source-only bridge change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = \
            'supabase/functions/pandora-projectos-bridge/index.ts'
          grep -F 'const RETRIEVABLE_CANON_STATUSES = new Set(["hard_canon", "soft_canon"]);' \
            supabase/functions/pandora-projectos-bridge/index.ts
          if grep -F 'const RETRIEVABLE_CANON_STATUSES = new Set(["hard_canon", "soft_canon", "draft"]);' \
            supabase/functions/pandora-projectos-bridge/index.ts; then
            echo 'Draft retrieval remains exposed' >&2
            exit 1
          fi
          grep -F 'privacy_policy: "metadata_only_v2_fail_closed"' \
            supabase/functions/pandora-projectos-bridge/index.ts
          if grep -F 'privacy_policy: "metadata_only_v1"' \
            supabase/functions/pandora-projectos-bridge/index.ts; then
            echo 'Legacy privacy response remains' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/pandora-projectos-bridge/index.ts
          git diff --cached --check
          git commit -m 'fix(memory): enforce approved-only atomic evidence intake'
          git push origin HEAD:hardening/memory-evidence-intake-atomic-approved-20260820
