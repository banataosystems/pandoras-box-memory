name: Apply Memory evidence hardening patch

on:
  push:
    branches:
      - hardening/memory-evidence-intake-atomic-approved-20260820
    paths:
      - .github/workflows/apply-memory-evidence-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-memory-evidence-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/memory-evidence-intake-atomic-approved-20260820

      - name: Verify bounded source lane
        shell: bash
        run: |
          set -euo pipefail
          expected_base='4d0075a2e79db504a80feec914ed379fdf87cf0d'
          git merge-base --is-ancestor "$expected_base" HEAD
          unexpected="$({
            git diff --name-only "$expected_base"...HEAD
          } | grep -Ev '^(.github/workflows/apply-memory-evidence-hardening.yml|scripts/apply_memory_evidence_hardening.patch|supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql)$' || true)"
          test -z "$unexpected" || {
            printf 'Unexpected pre-apply paths:\n%s\n' "$unexpected" >&2
            exit 1
          }
          test -f scripts/apply_memory_evidence_hardening.patch
          test -f supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql

      - name: Apply and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/apply_memory_evidence_hardening.patch
          git apply scripts/apply_memory_evidence_hardening.patch
          git diff --check
          grep -F 'const RETRIEVABLE_CANON_STATUSES = new Set(["hard_canon", "soft_canon"]);' \
            supabase/functions/pandora-projectos-bridge/index.ts
          if grep -F 'privacy_policy: "metadata_only_v1"' \
            supabase/functions/pandora-projectos-bridge/index.ts; then
            echo 'Legacy privacy response contract remains' >&2
            exit 1
          fi
          grep -F 'memory_projectos_evidence_candidate_review_atomic' \
            supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql
          grep -F "array['search_path=\"\"']::text[]" \
            supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/check_memory_evidence_intake.mjs \
            supabase/functions/pandora-projectos-bridge/index.ts \
            supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql \
            | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected post-apply paths:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Commit source-only hardening candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/check_memory_evidence_intake.mjs \
            supabase/functions/pandora-projectos-bridge/index.ts \
            supabase/migrations/20260820073000_atomic_projectos_evidence_candidate_review_queue.sql
          git diff --cached --check
          git commit -m 'fix(memory): make evidence intake atomic and approved-only'
          git push origin HEAD:hardening/memory-evidence-intake-atomic-approved-20260820
