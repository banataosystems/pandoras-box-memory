name: Machine Gateway Namespace Isolation

on:
  pull_request:
    paths:
      - "supabase/functions/pandora-machine-gateway/**"
      - "docs/architecture/MACHINE_GATEWAY_ARCHITECTURE.md"
      - ".github/workflows/machine-gateway-namespace-isolation.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/pandora-machine-gateway/**"
      - "docs/architecture/MACHINE_GATEWAY_ARCHITECTURE.md"
      - ".github/workflows/machine-gateway-namespace-isolation.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  namespace-isolation:
    name: Prove same-owner cross-namespace denial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.4.3
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Expected $EXPECTED_HEAD but checked out $actual_head" >&2
            exit 1
          fi
      - name: Check formatting
        run: >-
          deno fmt --check
          supabase/functions/pandora-machine-gateway/index.ts
          supabase/functions/pandora-machine-gateway/deno.json
          supabase/functions/pandora-machine-gateway/package.json
          supabase/functions/pandora-machine-gateway/memory-search-policy.ts
          supabase/functions/pandora-machine-gateway/memory-search-policy_test.ts
          supabase/functions/pandora-machine-gateway/memory-search-postgrest_test.ts
      - name: Install exact Edge Function dependencies
        run: >-
          npm ci
          --ignore-scripts
          --prefix supabase/functions/pandora-machine-gateway
      - name: Run namespace regressions
        run: >-
          deno test
          --config supabase/functions/pandora-machine-gateway/deno.json
          --allow-read=supabase/functions/pandora-machine-gateway/index.ts
          supabase/functions/pandora-machine-gateway/memory-search-policy_test.ts
          supabase/functions/pandora-machine-gateway/memory-search-postgrest_test.ts
      - name: Type-check the Edge Function
        run: >-
          deno check
          --config supabase/functions/pandora-machine-gateway/deno.json
          supabase/functions/pandora-machine-gateway/index.ts
