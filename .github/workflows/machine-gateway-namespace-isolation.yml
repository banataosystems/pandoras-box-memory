name: Machine Gateway Namespace Isolation

# NOTE: deliberately NOT path-filtered — this is a REQUIRED status check, and a
# path-filtered required check can never report on a PR outside its paths,
# permanently blocking merge.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  namespace-isolation:
    name: Prove same-owner cross-namespace denial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.4.3
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Expected $EXPECTED_HEAD but checked out $actual_head" >&2
            exit 1
          fi
      - name: Check formatting
        run: >-
          deno fmt --check
          supabase/functions/_shared
          supabase/functions/pandora-machine-gateway
      - name: Install exact Edge Function dependencies
        run: >-
          npm ci
          --ignore-scripts
          --prefix supabase/functions/pandora-machine-gateway
      - name: Run gateway regressions
        run: node scripts/run_gateway_tests.mjs
