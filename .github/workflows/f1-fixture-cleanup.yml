name: F1 fixture cleanup

on:
  push:
    branches:
      - feature/projectos-memory-evidence-intake
    paths:
      - .github/workflows/f1-fixture-cleanup.yml

permissions:
  contents: write

jobs:
  fix-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/projectos-memory-evidence-intake
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - name: Make fake access key runtime-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/test_memory_evidence_intake_behavior.mjs")
          text = path.read_text()
          old = '"' + 'AKIA' + 'IOSFODNN7EXAMPLE' + '"'
          new = '"AKIA" + "IOSFODNN7EXAMPLE"'
          if old not in text:
              raise SystemExit("fixture not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify behavior and literal-secret gate
        shell: bash
        run: |
          node scripts/test_memory_evidence_intake_behavior.mjs
          bash scripts/check_no_literal_secrets.sh
      - name: Commit fixture cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_memory_evidence_intake_behavior.mjs
          git diff --cached --check
          git commit -m "test(memory): construct sensitive fixture at runtime"
          git push origin HEAD:feature/projectos-memory-evidence-intake
