name: Capability Registry Gate

on:
  pull_request:
    paths:
      - "docs/capabilities/**"
      - "docs/roadmap/PANDORA_COMPOUNDING_INTELLIGENCE_MASTER_ROADMAP_V2.md"
      - "scripts/validate_capability_registry.mjs"
      - ".github/workflows/capability-registry-gate.yml"
  push:
    branches:
      - main
    paths:
      - "docs/capabilities/**"
      - "docs/roadmap/PANDORA_COMPOUNDING_INTELLIGENCE_MASTER_ROADMAP_V2.md"
      - "scripts/validate_capability_registry.mjs"
      - ".github/workflows/capability-registry-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable evidence registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate registry and rejection tests
        run: node scripts/validate_capability_registry.mjs --self-test

