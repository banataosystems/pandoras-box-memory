name: Supabase recovery evidence
on:
  pull_request:
    paths:
      - 'docs/migrations/**'
      - 'supabase/recovery/**'
      - 'scripts/check_supabase_*'
      - '.github/workflows/supabase-recovery-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check_migration_parity.mjs --self-test
      - run: node scripts/check_supabase_readback_status.mjs --self-test
      - run: node scripts/check_supabase_live_recovery.mjs --self-test
      - run: bash scripts/check_no_literal_secrets.sh
