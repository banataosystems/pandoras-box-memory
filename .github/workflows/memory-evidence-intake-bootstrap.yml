name: Bootstrap governed Memory evidence backend

on:
  push:
    branches:
      - feature/projectos-memory-evidence-intake
    paths:
      - '.github/workflows/memory-evidence-intake-bootstrap.yml'
      - 'scripts/bootstrap-memory-evidence-intake.js'
      - 'scripts/memory-evidence-helper.fragment.ts'
      - 'app/api/projectos/memory/evidence-candidates/**'
      - 'scripts/check_memory_evidence_intake.mjs'
      - '.github/workflows/memory-evidence-intake.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: bootstrap memory evidence intake backend'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Apply bounded backend patch
        run: node scripts/bootstrap-memory-evidence-intake.js

      - name: Verify source contract
        run: node scripts/check_memory_evidence_intake.mjs

      - name: Reject literal secrets
        run: bash scripts/check_no_literal_secrets.sh

      - name: Typecheck web boundary
        run: npm run typecheck

      - name: Build web boundary
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ivmvufhcsezyhczzondn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Commit exact source change and retire bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memory-evidence-intake-bootstrap.yml
          git rm .github/workflows/memory-evidence-anchor-diagnostic.yml
          git rm scripts/bootstrap-memory-evidence-intake.js
          git rm scripts/memory-evidence-helper.fragment.ts
          git rm scripts/diagnose-memory-evidence-anchors.js
          git rm scripts/memory-evidence-anchor-diagnostic.json
          rm -f package-lock.json
          git add \
            app/api/projectos/memory/evidence-candidates/route.ts \
            supabase/functions/pandora-projectos-bridge/index.ts \
            scripts/check_memory_evidence_intake.mjs \
            .github/workflows/memory-evidence-intake.yml
          git diff --cached --check
          git commit -m "feat: add review-gated project evidence intake"
          git push origin HEAD:feature/projectos-memory-evidence-intake
