name: Memory recovery web build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'next-env.d.ts'
      - '.github/workflows/web-recovery-build.yml'
  push:
    branches: [recovery/deployable-web-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ivmvufhcsezyhczzondn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
